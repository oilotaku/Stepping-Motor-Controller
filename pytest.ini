[pytest]
# 這兩支既有回歸測試腳本沿用原本的檔名（verify_scan_tab.py /
# verify_meter_panel.py，CLAUDE.md／README.md／HANDOVER.md 引用了十幾處，
# 不改名），靠這裡把 python_files 放寬成同時認得 verify_*.py 與標準的
# test_*.py，讓 pytest／VS Code Test Explorer 抓得到。
python_files = verify_*.py test_*.py
python_classes = Test*
python_functions = test_*

# 只在專案根目錄底下收集，並排除 venv、廠商驅動資料夾、執行期產出目錄
# 這些不相關/體積大的路徑（對照 .gitignore 已排除的項目），避免 pytest
# 掃描時拖慢速度或誤判成測試檔。
testpaths = .
norecursedirs =
    venv
    .venv
    .git
    __pycache__
    .ruff_cache
    .mypy_cache
    DS102-CDMv21228
    DS102_USB_Driver_V2.08.28
    logs
    recordings
    data
    output
    build
    dist
    node_modules
