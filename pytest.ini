[pytest]
# 這兩支既有回歸測試腳本沿用原本的檔名（verify_scan_tab.py /
# verify_meter_panel.py，CLAUDE.md／README.md／HANDOVER.md 引用了十幾處，
# 不改名），靠這裡把 python_files 放寬成同時認得 verify_*.py 與標準的
# test_*.py，讓 pytest／VS Code Test Explorer 抓得到。
python_files = verify_*.py test_*.py
python_classes = Test*
python_functions = test_*

# 2026-09-03 分資料夾遷移第二步：測試檔搬進 tests/，只在該目錄下收集。
testpaths = tests

# tests/ 底下的 conftest.py／verify_*.py 用 `import main_ai`、
# `from ds102_ctrl import ...` 這類指向專案根目錄模組的絕對 import。
# tests/ 沒有 __init__.py（刻意維持 rootless，不做成 package），pytest
# 預設只會把測試檔自己的目錄插進 sys.path，專案根目錄不會自動在裡面，
# 這裡用 pythonpath 明確補上，否則收集階段就會 ModuleNotFoundError。
pythonpath = .

# 排除 venv、廠商驅動資料夾、執行期產出目錄這些不相關/體積大的路徑
# （對照 .gitignore 已排除的項目），避免 pytest 掃描時拖慢速度或誤判成
# 測試檔。testpaths 已收斂到 tests/，這裡主要防的是未來 testpaths 又
# 放寬回 . 時的誤收集。
norecursedirs =
    venv
    .venv
    .git
    __pycache__
    .ruff_cache
    .mypy_cache
    DS102-CDMv21228
    DS102_USB_Driver_V2.08.28
    logs
    recordings
    data
    output
    build
    dist
    node_modules
